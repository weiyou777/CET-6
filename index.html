<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语六级真题题库 · 提分训练系统</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --blue:#2563eb; --blue-d:#1d4ed8; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --soft:#eef2ff; --soft2:#f0fdf4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
  header{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;padding:18px 22px;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:50;}
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px;}
  header p{margin:4px 0 0;font-size:12.5px;opacity:.9;}
  nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:40;}
  nav button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:13.5px;transition:.15s;}
  nav button:hover{border-color:var(--blue);color:var(--blue);}
  nav button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  h2{font-size:17px;margin:0 0 10px;}
  h3{font-size:14.5px;margin:14px 0 6px;color:var(--blue-d);}
  .muted{color:var(--muted);font-size:13px;}
  .badge{display:inline-block;background:var(--soft);color:var(--blue-d);border-radius:6px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0;}
  .badge.g{background:var(--soft2);color:var(--green);}
  .badge.a{background:#fff7ed;color:var(--amber);}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .btn{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:14px;transition:transform .12s ease, box-shadow .15s ease, background .15s ease;}
  .btn:hover{background:var(--blue-d);transform:translateY(-1px) scale(1.02);}
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue);}
  .btn.ghost:hover{background:#eff6ff;}
  .btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px;}
  /* 关键流程按钮：渐变 + 脉冲，提示“下一步” */
  .btn.cta{background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 4px 14px rgba(37,99,235,.32);}
  .btn.cta:hover{background:linear-gradient(135deg,#1d4ed8,#6d28d9);transform:translateY(-2px) scale(1.04);}
  @keyframes ctaPulse{0%,100%{box-shadow:0 4px 14px rgba(37,99,235,.30);}50%{box-shadow:0 7px 22px rgba(124,58,237,.55);}}
  .btn.cta.pulse{animation:ctaPulse 1.9s ease-in-out infinite;}
  .btn.big{font-size:15px;padding:11px 22px;}
  textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;font-family:inherit;resize:vertical;}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;margin:7px 0;cursor:pointer;font-size:14px;transition:.12s;}
  .opt:hover{border-color:var(--blue);}
  .opt.sel{border-color:var(--blue);background:var(--soft);}
  .opt.correct{border-color:var(--green);background:var(--soft2);}
  .opt.wrong{border-color:var(--red);background:#fef2f2;}
  .passage{background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:260px;overflow:auto;font-size:13.5px;white-space:pre-wrap;margin-bottom:10px;}
  .zh{font-size:15px;line-height:1.9;}
  .en{font-size:13.5px;color:#374151;background:#f8fafc;border-left:3px solid var(--blue);padding:8px 12px;border-radius:6px;margin-top:8px;white-space:pre-wrap;}
  .fb{border-radius:10px;padding:12px;margin-top:12px;font-size:13.5px;}
  .fb.ok{background:var(--soft2);border:1px solid #bbf7d0;}
  .fb.no{background:#fef2f2;border:1px solid #fecaca;}
  .stat{display:flex;gap:12px;flex-wrap:wrap;}
  .stat .box{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .stat .num{font-size:26px;font-weight:700;color:var(--blue);}
  .bar{height:14px;background:#eef2f7;border-radius:8px;overflow:hidden;margin:5px 0 12px;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#1d4ed8);}
  .bar.g > i{background:linear-gradient(90deg,#16a34a,#15803d);}
  .bar.r > i{background:linear-gradient(90deg,#dc2626,#b91c1c);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
  th{background:#f8fafc;}
  .pill{font-size:11.5px;padding:1px 7px;border-radius:5px;}
  .pill.c{background:var(--soft2);color:var(--green);}
  .pill.p{background:#fff7ed;color:var(--amber);}
  .pill.w{background:#fef2f2;color:var(--red);}
  .note{font-size:12.5px;color:var(--muted);}
  .filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  select,input[type=number]{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:24px;font-size:13.5px;z-index:999;opacity:0;transition:.3s;pointer-events:none;}
  .toast.show{opacity:.95;}
  .empty{text-align:center;color:var(--muted);padding:30px;}
  .prog{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:10px 0;}
  .prog > i{display:block;height:100%;background:var(--blue);}
  ul.tips{margin:6px 0;padding-left:20px;font-size:13.5px;}
  ul.tips li{margin:4px 0;}
  .linkres a{color:var(--blue);text-decoration:none;}
  .linkres a:hover{text-decoration:underline;}
  /* 朗读跟读组件 */
  .rabox{margin:6px 0;}
  .ratext{background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:280px;overflow:auto;font-size:13.5px;line-height:1.95;white-space:normal;}
  .ras{display:inline;margin-right:4px;cursor:pointer;border-radius:4px;padding:1px 2px;transition:background .12s;}
  .ras:hover{background:#eef2ff;}
  .ras.now{background:#dbeafe;color:#1e40af;font-weight:600;box-shadow:0 0 0 1px #93c5fd;}
  .ttsbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0;}
  .ttsbar select{font-size:12px;padding:4px 6px;}
  .dirwarn{border:1px solid #fde68a;background:#fffbeb;color:#92400e;padding:10px 12px;border-radius:10px;font-size:13px;margin:8px 0;}
  .dirok{border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;padding:10px 12px;border-radius:10px;font-size:13px;margin:8px 0;}
  code{background:#f1f5f9;padding:1px 5px;border-radius:5px;font-size:12.5px;}
  /* 提交后：参考原文定位高亮 + 题号徽标 */
  .ras.refhl{background:#fde68a;color:#7c2d12;box-shadow:0 0 0 1px #f59e0b;font-weight:500;}
  .ras.refhl.now{background:#fbbf24;}
  .qnbadge{display:inline-block;margin:0 3px;padding:1px 7px;font-size:11px;font-weight:700;color:#fff;background:var(--blue);border-radius:9px;vertical-align:super;line-height:1.4;}
  .refbox{margin:10px 0;padding:11px 13px;background:#fef9c3;border-left:4px solid #eab308;border-radius:10px;}
  .refbox .rtitle{font-size:13px;color:#854d0e;display:block;margin-bottom:6px;}
  .refsent{margin:6px 0;padding:7px 10px;background:#fff;border:1px dashed #fde68a;border-radius:8px;font-size:13px;line-height:1.7;color:#3f3f46;}
  .refsent.muted{color:var(--muted);font-style:italic;}
  /* 错题本：题目信息列、易错徽标、重做卡片 */
  .qinfo{max-width:280px;line-height:1.5;}
  .qinfo b{font-size:12px;color:var(--blue-d);}
  .badge.easy{background:#f59e0b;color:#fff;}
  .redobanner{border:1px solid #fde68a;background:#fffbeb;color:#92400e;padding:12px 14px;border-radius:12px;margin-bottom:14px;}
  .markarea{margin-top:10px;}
  .wrbtns{display:flex;gap:6px;flex-wrap:wrap;}
  /* 模拟考试 */
  .mock-header{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;border-radius:14px;padding:20px;margin-bottom:16px;}
  .mock-header h2{color:#fff;margin:0 0 6px;}
  .mock-header p{margin:0;opacity:.9;font-size:13px;}
  .mock-timer{position:sticky;top:62px;z-index:35;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.06);font-size:14px;}
  .mock-timer .clk{font-size:18px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;}
  .mock-timer .clk.warn{color:var(--red);}
  .mock-section-label{background:var(--soft);color:var(--blue-d);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;margin:10px 0;}
  .score-big{font-size:42px;font-weight:800;color:var(--blue);text-align:center;margin:10px 0;}
  .score-pass{color:var(--green)!important;}
  .score-fail{color:var(--red)!important;}
  .mock-history{margin-top:16px;}
  .mock-history table{font-size:12.5px;}
  /* 资源导航：分类标签 + 卡片网格 */
  .res-hero{background:linear-gradient(135deg,#0ea5e9,#0369a1);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px;}
  .res-hero h2{color:#fff;margin:0 0 6px;font-size:18px;}
  .res-hero p{margin:0;opacity:.9;font-size:13px;}
  .res-search{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;transition:.15s;}
  .res-search:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
  .res-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .res-tab{border:2px solid var(--line);background:#fff;padding:8px 16px;border-radius:22px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap;}
  .res-tab:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .res-tab.active{color:#fff;border-color:transparent;}
  .res-tab[data-cat="official"].active{background:#0ea5e9;}
  .res-tab[data-cat="papers"].active{background:#8b5cf6;}
  .res-tab[data-cat="listening"].active{background:#06b6d4;}
  .res-tab[data-cat="vocab"].active{background:#f59e0b;}
  .res-tab[data-cat="writing"].active{background:#ec4899;}
  .res-tab[data-cat="reading"].active{background:#10b981;}
  .res-tab[data-cat="video"].active{background:#ef4444;}
  .res-tab[data-cat="app"].active{background:#6366f1;}
  .res-tab[data-cat="book"].active{background:#84cc16;}
  .res-tab[data-cat="community"].active{background:#14b8a6;}
  .res-tab[data-cat="local"].active{background:#64748b;}
  .res-tab[data-cat="all"].active{background:var(--blue);}
  .res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .res-card{border:1px solid var(--line);border-radius:12px;padding:14px;transition:.15s;cursor:pointer;text-decoration:none;display:block;position:relative;overflow:hidden;}
  .res-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1);border-color:var(--blue);}
  .res-card .rc-icon{font-size:28px;margin-bottom:6px;display:block;}
  .res-card .rc-title{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .res-card .rc-desc{font-size:12.5px;color:var(--muted);line-height:1.55;}
  .res-card .rc-tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:5px;margin-top:6px;font-weight:600;}
  .res-cat-header{font-size:16px;font-weight:700;margin:20px 0 10px;padding:8px 14px;border-radius:10px;display:flex;align-items:center;gap:8px;}
  .res-cat-header .count{font-size:12px;font-weight:400;opacity:.7;margin-left:auto;}
  .res-cat-official{background:linear-gradient(135deg,#e0f2fe,#f0f9ff);color:#0369a1;border-left:4px solid #0ea5e9;}
  .res-cat-papers{background:linear-gradient(135deg,#ede9fe,#f5f3ff);color:#6d28d9;border-left:4px solid #8b5cf6;}
  .res-cat-listening{background:linear-gradient(135deg,#cffafe,#ecfeff);color:#0e7490;border-left:4px solid #06b6d4;}
  .res-cat-vocab{background:linear-gradient(135deg,#fef3c7,#fffbeb);color:#92400e;border-left:4px solid #f59e0b;}
  .res-cat-writing{background:linear-gradient(135deg,#fce7f3,#fdf2f8);color:#9d174d;border-left:4px solid #ec4899;}
  .res-cat-reading{background:linear-gradient(135deg,#d1fae5,#ecfdf5);color:#065f46;border-left:4px solid #10b981;}
  .res-cat-video{background:linear-gradient(135deg,#fee2e2,#fef2f2);color:#991b1b;border-left:4px solid #ef4444;}
  .res-cat-app{background:linear-gradient(135deg,#e0e7ff,#eef2ff);color:#3730a3;border-left:4px solid #6366f1;}
  .res-cat-book{background:linear-gradient(135deg,#d9f99d,#f7fee7);color:#3f6212;border-left:4px solid #84cc16;}
  .res-cat-community{background:linear-gradient(135deg,#ccfbf1,#f0fdfa);color:#115e59;border-left:4px solid #14b8a6;}
  .res-cat-local{background:linear-gradient(135deg,#e2e8f0,#f1f5f9);color:#334155;border-left:4px solid #64748b;}
</style>
</head>
<body>
<header>
  <h1>英语六级真题题库 · 提分训练系统 <span style="font-size:12px;font-weight:500;opacity:.85;border:1px solid rgba(255,255,255,.5);padding:1px 8px;border-radius:10px;vertical-align:middle">v1.01</span></h1>
  <p>近10年真题去重归纳 · 全题型在线练习 · 错题本 · 分析报告 · 本地缓存追踪 · 2026时事新题</p>
</header>
<nav id="nav">
  <button data-v="home" class="active">提分策略</button>
  <button data-v="practice">在线练习</button>
  <button data-v="mock">模拟考试</button>
  <button data-v="wrong">错题本</button>
  <button data-v="report">分析报告</button>
  <button data-v="res">资源导航</button>
  <button data-v="data">数据管理</button>
</nav>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="data_writing.js"></script>
<script src="data_translation_a.js"></script>
<script src="data_translation_b.js"></script>
<script src="data_reading.js"></script>
<script src="data_listening.js"></script>
<script src="data_news.js"></script>
<script src="app.js"></script>
</body>
</html>
